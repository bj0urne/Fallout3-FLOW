; FCCO (Fallout Character Controller Overhaul) - third person movement, camera and crosshair,
; and first person gun sway for Fallout 3
; Changes take effect the next time the game starts.

[General]
; 0 = plugin does nothing
bEnabled=1
; How much the upper body turns along with the legs (0 = keeps facing forward, 1 = whole body turns).
; Values above 0 make the torso and weapon point away from where you aim.
fUpperBodyTurn=0
; How much of the legs' turn the belly / lower back takes (0 = all the twist at the hips, which
; looks thin at large angles; 0.5 = spread smoothly up to the chest, which always stays forward)
fWaistTwist=0.5

[Diagonal]
; Legs face the direction you move in when moving diagonally
bEnabled=1
; How far the legs turn, in degrees (diagonal = 45)
fMaxAngle=45
; Roughly how long the legs take to turn into / out of a diagonal (milliseconds, 0 = instant)
fTurnTimeMs=250
; Also turn the legs when moving diagonally backwards
bBackDiagonals=1
; Weapon holstered: diagonals (forward and backward) turn the whole body instead of just the legs;
; the head keeps looking at the camera. Pure strafing stays a side-step. Needs [FreeLook] enabled.
bWholeBodyWhenHolstered=1
; Weapon drawn: pure strafing (only A or D) plays the forward walk/run with the legs turned to the
; side, instead of the separate strafe animation, so the torso animation never changes
bStrafeAsRunWithWeapon=1
; How far the legs turn for that (degrees)
fStrafeAngle=90
; Controller: the legs (or the whole body when holstered) follow the exact stick angle in any
; direction, using only the forward/backward animations. Keyboard keeps its 8 directions.
bController360=1

[TurnInPlace]
; Standing still and turning: the feet stay planted, then the legs pivot round to catch up
bEnabled=1
; Twist (degrees) between legs and body at which the legs start to catch up
fThreshold=60
; The legs never twist further than this (degrees)
fMaxTwist=90
; Top speed of the legs pivoting round when catching up (degrees per second)
fCatchUpSpeed=120
; How gently the pivot speeds up at the start and slows down at the end (degrees per second
; squared; lower = smoother and slower)
fCatchUpAccel=450
; Play the game's turn animation (stepping feet) while the legs catch up, and stop the idle from
; switching to it every time the mouse moves while the feet are planted. 0 = vanilla turn animation.
bTurnAnimation=1
; Seconds of standing still without turning before the legs line up again (0 = stay twisted)
fSettleDelay=1.0
; Smoothing when you start moving and the legs line up with the body (milliseconds)
fMoveAlignTimeMs=80

[FreeLook]
; Weapon holstered and standing still: the camera turns freely without turning the body, and the
; head follows the camera. Moving or drawing the weapon turns the body to face the camera.
bEnabled=1
; How quickly the body turns to face the camera when you move or draw (milliseconds)
fBodyAlignTimeMs=150
; The head follows the camera up to this many degrees to the side, beyond that it looks ahead
fHeadMaxYaw=80
; How far the head tilts up / down (degrees)
fHeadMaxUp=35
fHeadMaxDown=40
; Head smoothing (milliseconds)
fHeadTurnTimeMs=150
; Share of the head turn done by the neck (the rest by the head bone)
fNeckShare=0.4

[Moving]
; Turning while moving: the legs trail a little behind the body, then catch up
bLegLag=1
; Weapon holstered: the torso trails behind too, only the head keeps looking where the camera
; points (needs [FreeLook] enabled). With the weapon drawn only the legs trail, so aim stays true.
bTorsoLag=1
; How far the legs (and torso) may trail behind (degrees)
fLegLagMax=25
; How quickly they catch up (milliseconds)
fLegLagTimeMs=150
; Running at full speed: lean into turns
bLean=1
; Maximum lean (degrees)
fLeanMax=8
; Degrees of lean per 100 degrees/second of turning
fLeanPer100DegPerSec=4
; Lean smoothing (milliseconds)
fLeanTimeMs=150
; Starting, stopping and changing speed eases in and out instead of being instant
; (first and third person)
bAcceleration=1
; Roughly how long it takes to reach full speed / to stop (milliseconds)
fAccelerationMs=60
fDecelerationMs=60
; Landing after a jump or a fall: no landing animation (the stumble that holds you in place);
; you can move the moment you touch the ground (first and third person). 0 = vanilla
bNoLandingStumble=1

[Crosshair]
; A real crosshair that opens up to show your gun's actual spread (weapon accuracy, condition,
; skill, crippled limbs, aiming, crouching, moving and perks). Only with a gun drawn; replaces the
; vanilla crosshair while shown (the vanilla one follows your in-game setting otherwise).
bEnabled=1
; 0 = the game's own crosshair, split in two: the halves move apart to show your spread,
;     with a dot in the middle
; 1 = four lines (fMinGap, fLineLength, fThickness and bOutline apply to this style only)
iStyle=0
; Style 0: size of the crosshair (1.0 = the game's own size)
fSize=1.0
; Style 0: centre dot diameter (pixels at 1080p, scaled with resolution; 0 = no dot)
fDotSize=3
; Scales the gap (calibration: 1.0 = the game's spread cone)
fSpreadScale=1.0
; How far the gun sways at full wobble, in degrees. The game's wobble (skill, aiming, crouching,
; moving, condition, perks) times this is added to the gap. Measured in game: about 8
fWobbleDegrees=8
; Third person: bullets start at the gun, beside the camera, so up close they miss what the
; crosshair is on. 1 = each shot starts on the crosshair line (level with the gun) and flies
; along it, so it hits what the crosshair shows (spread kept, VATS untouched). 0 = vanilla
bThirdPersonAimAtCrosshair=1
; First person: the same, so a railing or corner in front of the gun (but not in front of
; your eyes) no longer blocks the shot. 0 = vanilla
bFirstPersonAimAtCrosshair=1
; Those shots start beside the camera, so their tracer would seem to come out of the camera
; (and from the wrong side while strafing): hide it. The game's impact effects still show
; where shots land
bHideTracersOnCrosshairLine=1
; Smallest gap, line length and thickness (pixels at 1080p, scaled with resolution)
fMinGap=3
fLineLength=9
fThickness=2
; How smoothly the gap opens/closes (milliseconds)
fSmoothMs=60
; Use the game's HUD colour, or the colour below
bUseHUDColor=1
iRed=26
iGreen=255
iBlue=128
fOpacity=0.9
; Dark outline for readability
bOutline=1
; Hide while looking through a scope
bHideWhenScoped=1

[GunSway]
; First person: the arms and gun trail a little behind the view when you look around, then
; float back (like Half-Life 2). Visual only (shots still go where the crosshair points).
; Fades out when aiming down the sights, in menus and VATS, and with the weapon holstered.
bEnabled=1
; How much of the view's turn the gun trails behind (0.3 = 30%)
fAmount=0.3
; How quickly the gun catches up (milliseconds)
fCatchUpMs=100
; The sway approaches this many degrees: small movements sway fully, bigger ones add less and
; less, without a hard stop
fMaxDegrees=8
; Jumping and landing: the first person jump/land animations no longer shake the weapon;
; the arms dip softly and spring back instead. 0 = vanilla animations
bSmoothJump=1
; The arms follow looking up and down fully, so the gun stays in the same place on screen
; (vanilla lets it shift). 0 = vanilla
bLockPitch=1
; How far the arms dip when jumping, and when landing after about a second in the air
; (longer falls dip more), in game units
fJumpDip=1.5
fLandDip=3
; Walking and running: instead of the first person walk/run animations (the weapon bob), the
; arms dip softly once per step, quicker and deeper the faster you move, with a footstep at the
; bottom of each dip. 0 = vanilla animations
bSmoothSteps=1
; How far the arms dip per step when running, in game units (walking dips less)
fStepDip=0.6
; How far the arms sway to the side with each step (alternating left and right), in game units
fStepSway=0.5
; Moving sideways: the gun glides a little the other way and settles back when you stop (less
; when moving diagonally), in game units at running speed. 0 = off
fStrafeShift=2

[Camera]
; Third person camera polish
bEnabled=1
; Holding the POV key (vanity camera): orbit so the player stays on the same side of the screen
; as in normal play, instead of orbiting around the over-the-shoulder point
bVanityOrbitFix=1
; Swap the camera to the other shoulder with a key
bShoulderSwap=1
; Key code (Windows virtual-key): 0x04 = middle mouse button, 0x05/0x06 = mouse side buttons,
; letters = their ASCII code in hex, e.g. 0x51 = Q
iShoulderSwapKey=0x04
; How long the swap takes (milliseconds)
fShoulderSwapMs=167

[Skeleton]
; Node turned for whole-body effects (free look, torso lag, holstered diagonals, lean).
; Scene Root = the actor's 3D root, which keeps the game's foot IK working on uneven ground.
; Bip01 = the skeleton root (older behaviour; foot IK then misplaces the feet when turned).
sBodyNode=Scene Root
; Pause the game's foot IK while the body or legs are turned (fallback if feet still misbehave on
; uneven ground; feet then don't adapt to slopes while turned)
bDisableFootIKWhenTurned=0
; Bone that is turned (it and everything below it follows)
sLegsNode=Bip01 Pelvis
; Upper body bone (empty = Bip01 Spine). If it hangs below sLegsNode it is turned back so the
; torso keeps facing forward; if it sits beside it (vanilla skeleton) it is only turned by fUpperBodyTurn.
sUpperBodyNode=

[Debug]
; Logs the player's skeleton, movement flag changes and turn-in-place events to FCCO.log
bDebug=0
